name: Build and deploy docs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: |
          sudo apt -y install zsh

      - name: Install antigen & zshrc
        run: |
          wget https://raw.githubusercontent.com/xgarrido/zsh-dotfiles/master/dotfiles/zshrc -O ~/.zshrc
          zsh -i -c "echo"

      - name: Install python deps
        run: |
          python -m pip install -r requirements.txt

      - name: Build html
        run: |
          make -C slides html

      - name: Upload pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: slides/html

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
