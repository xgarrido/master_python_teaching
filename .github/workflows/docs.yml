name: Build and deploy docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps via zshrc
        run: |
          wget https://raw.githubusercontent.com/xgarrido/zsh-dotfiles/master/dotfiles/zshrc ~/.zshr
          zsh -i -c "echo"

